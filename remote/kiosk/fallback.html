<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LASDPC Station — Aguardando dashboard</title>
<style>
  :root{ color-scheme: dark; }
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;flex-direction:column;
       font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#0b1020;color:#e6e9f2;text-align:center}
  .card{max-width:820px;padding:48px}
  h1{font-size:2.4rem;margin:0 0 .4em}
  p{font-size:1.3rem;color:#9aa3bd;line-height:1.5}
  .dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:#f5a623;margin-right:8px;animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .small{font-size:1rem;margin-top:24px;color:#6b7390}
</style>
</head>
<body>
  <div class="card">
    <h1><span class="dot"></span>LASDPC Pi Station</h1>
    <p>O dashboard está indisponível no momento.<br>Tentando reconectar automaticamente…</p>
    <p class="small">Esta é a página local de contingência. A página recarrega quando a rede/dashboard voltar.</p>
  </div>
  <script>
    // Tenta voltar ao destino assim que a rede responder
    let tries = 0;
    async function check(){
      tries++;
      try{
        await fetch(window.location.href, {cache:'no-store', mode:'no-cors'});
      }catch(e){}
      // Recarrega periodicamente; o lasdpc-session reabre a URL real quando a rede volta
      if (tries % 6 === 0){ location.reload(); }
    }
    setInterval(check, 5000);
  </script>
</body>
</html>
