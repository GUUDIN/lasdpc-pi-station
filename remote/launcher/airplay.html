<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AirPlay — LASDPC</title>
<style>
  html,body{height:100%;margin:0;overflow:hidden}
  *{box-sizing:border-box}
  body{font-family:system-ui,Segoe UI,Roboto,sans-serif;background:linear-gradient(160deg,#0b1020,#14213d);
       color:#e6e9f2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:28px;padding:5vw}
  .ico{font-size:7rem;line-height:1;filter:drop-shadow(0 8px 24px rgba(120,170,255,.4))}
  h1{font-size:3rem;margin:0;letter-spacing:.5px}
  .steps{font-size:1.6rem;line-height:1.9;color:#c7cde0;max-width:900px}
  .dev{display:inline-block;background:#e6e9f2;color:#0b1020;font-weight:800;border-radius:12px;padding:6px 18px;margin:0 4px}
  .num{display:inline-flex;width:2.2rem;height:2.2rem;border-radius:50%;background:#e6e9f2;color:#0b1020;
       font-weight:800;align-items:center;justify-content:center;margin-right:12px;vertical-align:middle}
  .hint{font-size:1.15rem;color:#8b93ad;margin-top:10px}
  .wait{font-size:1.2rem;color:#9cc0ff}
  .pulse{animation:p 1.6s ease-in-out infinite}@keyframes p{0%,100%{opacity:.4}50%{opacity:1}}
  .back{position:fixed;top:24px;left:24px;font:inherit;font-size:1.1rem;color:inherit;background:rgba(255,255,255,.08);
        border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:10px 18px;cursor:pointer}
  .back:hover,.back:focus-visible{background:rgba(255,255,255,.16);outline:3px solid rgba(255,255,255,.5);outline-offset:2px}
</style>
</head>
<body>
  <div class="ico">📡</div>
  <h1>Espelhar tela na TV</h1>
  <div class="steps">
    <div><span class="num">1</span>Conecte o <b>iPhone, iPad ou Mac</b> à mesma rede Wi-Fi</div>
    <div><span class="num">2</span>Abra a <b>Central de Controle</b> → <b>Espelhamento de Tela</b> 📱</div>
    <div><span class="num">3</span>Escolha <span class="dev">TV LASDPC</span></div>
  </div>
  <div class="wait pulse">● aguardando conexão AirPlay…</div>
  <div class="hint">Esc ou Super+Esc volta ao menu • no app do YouTube, use Transmitir → AirPlay</div>
<button class="back" id="back" autofocus>← Menu</button>
<script>
  // Volta ao menu central: botao (mouse/Enter), Esc/Backspace ou B do controle.
  let leaving=false;
  function goMenu(){ if(leaving) return; leaving=true; fetch('/api/mode/menu',{method:'POST'}).catch(()=>{ leaving=false; }); }
  document.getElementById('back').addEventListener('click',goMenu);
  addEventListener('keydown',e=>{ if(e.key==='Escape'||e.key==='Backspace'){ e.preventDefault(); goMenu(); } });
  (function gp(){
    for(const g of (navigator.getGamepads?navigator.getGamepads():[])) if(g&&g.buttons[1]&&g.buttons[1].pressed) goMenu();
    requestAnimationFrame(gp);
  })();
</script>
</body>
</html>
