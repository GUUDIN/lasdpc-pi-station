# Mosquitto — LASDPC Pi Station
# Sem acesso anônimo. Autenticação por usuário/senha (arquivo passwd).
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/
autosave_interval 300

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type warning
log_type error
log_type notice
log_timestamp true

max_keepalive 120
