# ============================================================
# LASDPC Pi Station — Stack IoT (ARM64 / Debian 13 trixie)
# Versões fixadas, healthchecks, unless-stopped, logs limitados,
# rede dedicada, timezone, dados em /srv (DATA_ROOT). Segredos via .env.
# Validar com: docker compose config   ANTES de subir.
# Portas ficam acessíveis na LAN e via Tailscale; o firewall (hardening)
# restringe à LAN+tailscale. Sem encaminhamento no roteador.
# ============================================================
name: lasdpc-iot

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  iot:
    name: lasdpc-iot

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: lasdpc-mosquitto
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "1883:1883"
    volumes:
      - ${DATA_ROOT:-/srv/lasdpc-pi-station}/mosquitto/config:/mosquitto/config
      - ${DATA_ROOT:-/srv/lasdpc-pi-station}/mosquitto/data:/mosquitto/data
      - ${DATA_ROOT:-/srv/lasdpc-pi-station}/mosquitto/log:/mosquitto/log
    networks: [iot]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -u \"$MOSQUITTO_USERNAME\" -P \"$MOSQUITTO_PASSWORD\" -W 3 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  influxdb:
    image: influxdb:2.7
    container_name: lasdpc-influxdb
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-lasdpc}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-iot}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUX_RETENTION:-30d}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_ADMIN_TOKEN}
    ports:
      - "8086:8086"
    volumes:
      - ${DATA_ROOT:-/srv/lasdpc-pi-station}/influxdb/data:/var/lib/influxdb2
      - ${DATA_ROOT:-/srv/lasdpc-pi-station}/influxdb/config:/etc/influxdb2
    networks: [iot]
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  node-red:
    image: nodered/node-red:4.0
    container_name: lasdpc-nodered
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "1880:1880"
    volumes:
      - ${DATA_ROOT:-/srv/lasdpc-pi-station}/node-red/data:/data
    networks: [iot]
    depends_on:
      - mosquitto
      - influxdb
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:1880/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  grafana:
    image: grafana/grafana-oss:11.3.1
    container_name: lasdpc-grafana
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "3000:3000"
    volumes:
      - ${DATA_ROOT:-/srv/lasdpc-pi-station}/grafana/data:/var/lib/grafana
      - ${DATA_ROOT:-/srv/lasdpc-pi-station}/grafana/provisioning:/etc/grafana/provisioning
    networks: [iot]
    depends_on:
      - influxdb
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  homepage:
    image: ghcr.io/gethomepage/homepage:v0.9.13
    container_name: lasdpc-homepage
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      HOMEPAGE_ALLOWED_HOSTS: "*"
    ports:
      - "8080:3000"
    volumes:
      - ${DATA_ROOT:-/srv/lasdpc-pi-station}/homepage/config:/app/config
    networks: [iot]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
